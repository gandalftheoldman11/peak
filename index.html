<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peak — 12-week dumbbell plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F7; --surface:#FFFFFF; --ink:#161C33; --muted:#5C6580; --line:#D7DCE8;
  --accent:#2B4FD8; --accent-ink:#FFFFFF; --sun:#E9A21F; --sun-soft:#FBEFD5; --good:#1E9E6A; --mtn1:#C9D1E4; --mtn2:#A9B4D0;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1426; --surface:#182039; --ink:#EEF1F8; --muted:#98A1BD; --line:#2A3352;
    --accent:#7C97FF; --accent-ink:#0F1426; --sun:#F5C04F; --sun-soft:#3A3220; --good:#3CCB8F; --mtn1:#222B4A; --mtn2:#2E3961;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1426; --surface:#182039; --ink:#EEF1F8; --muted:#98A1BD; --line:#2A3352;
  --accent:#7C97FF; --accent-ink:#0F1426; --sun:#F5C04F; --sun-soft:#3A3220; --good:#3CCB8F; --mtn1:#222B4A; --mtn2:#2E3961;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:560px;margin:0 auto;padding:16px 18px 150px}
h1,h2,h3{font-stretch:118%;line-height:1.15;margin:0}
h1{font-size:2rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 18px;font-weight:700;font-stretch:110%;font-size:1.05rem;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:.95rem;border-radius:10px}
.linkbtn{background:none;border:0;padding:8px 0;color:var(--accent);font-weight:700}
.center{text-align:center}

.hero{position:relative;margin:4px -18px 0;overflow:hidden}
.hero svg{display:block;width:100%;height:auto;margin-top:-30px}
.hero-text{padding:8px 18px 0}
.hero-text .big{font-size:3.4rem;font-weight:800;font-stretch:125%;line-height:1;letter-spacing:-.02em}
.hero-text .big span{font-size:1.2rem;font-weight:600;color:var(--muted);letter-spacing:0}

.today{background:var(--surface);border-radius:20px;padding:20px;margin-top:-8px;position:relative;border:1px solid var(--line)}
.today .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.chips{display:flex;gap:6px;margin:0 0 18px}
.chip{flex:1;text-align:center;padding:8px 0;border-radius:10px;font-size:.8rem;font-weight:700;background:var(--bg);color:var(--muted)}
.chip.train{color:var(--ink)}
.chip.now{outline:2px solid var(--accent);color:var(--accent)}
.chip.done{background:var(--good);color:#fff}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.card.warn{background:var(--sun-soft);border-color:transparent}
.card.next{display:flex;gap:14px;align-items:flex-start}
.card.next .time{font-weight:800;font-stretch:120%;font-size:1.1rem;white-space:nowrap;min-width:78px}
.badge{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--muted)}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-tip{margin-top:4px}
.target{font-size:.8rem;font-weight:700;color:var(--muted);text-align:right;padding-top:3px;flex-shrink:0}
.slow{display:inline-block;margin-top:8px;font-size:.8rem;font-weight:700;color:var(--ink);background:var(--sun-soft);padding:4px 10px;border-radius:8px}
.sets{margin-top:12px;display:grid;gap:8px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:8px;align-items:center}
.set.bw{grid-template-columns:28px 2fr 52px}
.set.tm{grid-template-columns:28px 1fr 52px 52px}
.check.play{border-color:var(--accent)}
.check.play svg{stroke:none;fill:var(--accent);width:18px;height:18px}
.set.done .check.play{background:transparent;border-color:var(--line)}
.set.done .check.play svg{fill:var(--muted)}
.timer-in{gap:10px !important}
.timer-in .grow{min-width:0;font-weight:700}
.timer-in button{padding:6px 10px !important;font-size:.9rem;flex-shrink:0}
.set .n{font-weight:700;color:var(--muted);text-align:center}
.field{position:relative;display:block}
.field input,.field select{width:100%;font:inherit;font-weight:700;font-size:1.1rem;text-align:center;padding:10px 30px 10px 8px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);-moz-appearance:textfield;appearance:none}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:.75rem;color:var(--muted);pointer-events:none}
.check{width:52px;height:48px;border-radius:12px;border:2px solid var(--line);background:transparent;display:grid;place-items:center}
.check svg{width:22px;height:22px;stroke:var(--muted)}
.set.done .check{background:var(--good);border-color:var(--good)}
.set.done .check svg{stroke:#fff}
.set.done input,.set.done select{border-color:transparent}
.session-top{display:flex;justify-content:space-between;align-items:center;gap:10px}

.timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:20;display:none;justify-content:center;padding:0 12px 10px}
.timer.on{display:flex}
.timer-in{width:100%;max-width:536px;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 16px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
.timer-bar{position:absolute;left:0;bottom:0;height:4px;background:var(--sun);transition:width 1s linear}
.timer-num{font-size:1.6rem;font-weight:800;font-stretch:125%;font-variant-numeric:tabular-nums;min-width:72px}
.timer-in .grow{flex:1;font-size:.9rem}
.timer-in button{background:transparent;border:2px solid currentColor;border-radius:10px;padding:6px 12px;font-weight:700;color:inherit}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:560px;margin:0 auto;display:flex}
nav button{flex:1;background:none;border:0;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78rem;font-weight:700;color:var(--muted)}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent)}

.weigh{display:flex;gap:8px;margin-top:12px;align-items:stretch}
.weigh .field{flex:1}
.list{margin-top:10px}
.li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li b{font-weight:700}
.li .r{text-align:right;flex-shrink:0}
.up{color:var(--good);font-weight:700}
.chart svg{display:block;width:100%;height:auto;margin-top:12px}
.empty{padding:14px 0 4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.day{text-align:center;border-radius:10px;padding:10px 0;background:var(--bg);font-size:.8rem}
.day b{display:block;font-size:1rem;font-stretch:120%}
.day.t{background:var(--accent);color:var(--accent-ink)}
.rules p+p{margin-top:10px}

.meal{display:grid;grid-template-columns:auto 1fr 44px;gap:12px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.meal:first-child{border-top:0}
.meal .time{font-weight:800;font-stretch:110%;white-space:nowrap;min-width:72px}
.meal h3{font-size:1rem}
.meal.now .time{color:var(--accent)}
.meal .check{width:44px;height:44px}
.meal.done .check{background:var(--good);border-color:var(--good)}
.meal.done .check svg{stroke:#fff}
.meal.done h3,.meal.done p{opacity:.55}
.grp+.grp{margin-top:18px}
.grp h3{margin-bottom:2px}

.bells{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.bell{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:8px 8px 8px 14px;font-weight:700}
.bell button{border:0;background:var(--surface);border-radius:8px;width:30px;height:30px;color:var(--muted);font-size:1.1rem;line-height:1}
.addbell{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:12px}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:40;transition:transform .25s ease;max-width:90vw}
.toast.on{transform:translate(-50%,0)}

/* how-to + warm-up */
.how{margin-top:10px}
.how summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:.9rem;list-style:none;padding:4px 0}
.how summary::-webkit-details-marker{display:none}
.how[open] summary{margin-bottom:4px}
.how ol{margin:6px 0 0;padding-left:20px;font-size:.92rem}
.how li+li{margin-top:5px}
.mistake{margin-top:10px;font-size:.875rem;background:var(--sun-soft);padding:9px 12px;border-radius:10px}
.demo{display:inline-block;margin-top:10px;font-weight:700;color:var(--accent);text-decoration:none}
.warm-now{text-align:center;padding:8px 0 4px}
.warm-now .move{font-size:1.5rem;font-weight:800;font-stretch:118%;margin-top:4px}
.warm-now .count{font-size:3rem;font-weight:800;font-stretch:125%;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:8px}
.warm-list{margin-top:10px}
.warm-list .li.cur span:first-child{font-weight:700;color:var(--accent)}
.warm-list .li.past span:first-child{color:var(--muted);text-decoration:line-through}
.warm-btns{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:14px}
.warm-btns.three{grid-template-columns:1fr 1fr 1fr}
.warm-now .poses{max-width:300px;margin:10px auto 0}
.paused{color:var(--sun)}
.warm-done{display:flex;align-items:center;gap:10px;font-weight:700}
.warm-done i{width:26px;height:26px;border-radius:99px;background:var(--good);display:grid;place-items:center}
.warm-done i svg{width:15px;height:15px;stroke:#fff}

.poses{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}
.pose{background:var(--bg);border-radius:14px;padding:6px 6px 6px;text-align:center}
.pose.wide{grid-column:span 2}
.pose.wide svg{width:60%;margin:0 auto}
.pose svg{width:100%;height:auto;display:block;max-height:170px}
.pose span{font-size:.78rem;font-weight:700;color:var(--muted)}
.tier{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.tier button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 10px;text-align:left}
.tier button b{display:block;font-size:1.15rem;font-stretch:118%}
.tier button span{font-size:.8rem;color:var(--muted)}
.tier button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tier button[aria-pressed="true"] b{color:var(--accent)}
.mk{align-items:center}
.mk .check{width:42px;height:42px;flex-shrink:0}
.mk.got .check{background:var(--good);border-color:var(--good)}
.mk.got .check svg{stroke:#fff}
.mk.got b,.mk.got .q{text-decoration:line-through;opacity:.55}
.mbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.mbar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s ease}

.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(8,10,24,.55);display:none;align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.sheet-bg.on{display:flex}
.sheet{width:100%;max-width:536px;background:var(--surface);border-radius:22px;padding:22px 20px 18px;border:1px solid var(--line)}

/* premium layer */
main{padding-top:0}
.hero{margin:0 -18px;border-radius:0 0 28px 28px;overflow:hidden;color:#fff;background:#151B3D}
.hero-sky{background:linear-gradient(180deg,#0E1330 0%,#1C2659 38%,#6E4C78 68%,#EFA766 100%);padding-top:18px}
.hero svg{margin-top:-34px}
.hero-text .big span{color:rgba(255,255,255,.72)}
.hero-sub{font-size:.9rem;color:rgba(255,255,255,.75);margin-top:4px}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);padding:2px 18px 22px;gap:8px}
.stat b{display:block;font-size:1.35rem;font-weight:800;font-stretch:120%;line-height:1.2}
.stat span{font-size:.8rem;color:rgba(255,255,255,.65)}
.sec{font-size:.95rem;font-weight:700;font-stretch:100%;color:var(--muted);margin:24px 4px 10px}
.sec + .card,.sec + .today{margin-top:0}
.card+.card{margin-top:10px}
.card,.today,.ex{border-radius:20px;box-shadow:0 1px 0 var(--line)}
.today{margin-top:0}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-top:16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.seg button{flex:1;border:0;background:none;padding:9px 0;border-radius:10px;font-weight:700;font-size:.92rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.page-head{padding-top:22px}
.page-head p{margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.tile b{display:block;font-size:1.5rem;font-weight:800;font-stretch:120%;line-height:1.15}
.tile span{font-size:.8rem;color:var(--muted)}
.ring{display:flex;align-items:center;gap:14px}
.ring svg{width:56px;height:56px;flex-shrink:0}
.session-top{display:block;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 8px;margin:0 -2px}
.pbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s ease}
nav{background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>

<div class="timer" id="timer" role="status" aria-live="polite">
  <div class="timer-in">
    <div class="timer-num" id="timerNum">1:30</div>
    <div class="grow" id="timerLabel">Rest</div>
    <button id="timerPause" type="button">Pause</button>
    <button id="timerAdd" type="button">+30s</button>
    <button id="timerSkip" type="button">Skip</button>
    <div class="timer-bar" id="timerBar"></div>
  </div>
</div>

<nav aria-label="Sections"><div class="in">
  <button data-tab="today" type="button"><svg viewBox="0 0 24 24"><path d="M3 20l6-10 4 6 3-4 5 8z"/></svg>Today</button>
  <button data-tab="food" type="button"><svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0zM12 3c0 2-2 2-2 4M15 4c0 2-2 2-2 4"/></svg>Food</button>
  <button data-tab="progress" type="button"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Progress</button>
  <button data-tab="plan" type="button"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Plan</button>
</div></nav>

<div class="toast" id="toast"></div>
<div class="sheet-bg" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetMsg">
  <div class="sheet">
    <h3 id="sheetMsg"></h3>
    <p class="muted small" id="sheetSub" style="margin-top:6px"></p>
    <div style="display:grid;gap:8px;margin-top:18px">
      <button class="btn" id="sheetYes" type="button" style="background:#D9534F;color:#fff">Yes</button>
      <button class="btn ghost" id="sheetNo" type="button">Keep going</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ---------- workout data ---------- */
const EX = {
  gs:{name:"Goblet squat",kind:"w",mode:"single",tip:"Hold one dumbbell at your chest. Sit back and down, chest up."},
  fp:{name:"Floor press",kind:"w",mode:"pair",tip:"Lie on the floor, press both dumbbells up. Elbows touch the floor lightly."},
  or:{name:"One-arm row",kind:"w",mode:"single",tip:"Hand on a chair, pull the dumbbell to your hip. Reps per side."},
  sp:{name:"Shoulder press",kind:"w",mode:"pair",tip:"Press overhead from shoulder height. Don’t arch your back."},
  bc:{name:"Bicep curl",kind:"w",mode:"pair",tip:"Elbows pinned to your sides. Lower slowly."},
  pl:{name:"Plank",kind:"t",tip:"Straight line from head to heels. Squeeze your glutes."},
  rdl:{name:"Romanian deadlift",kind:"w",mode:"single",tip:"Hold the dumbbell with both hands. Push your hips back with a slight knee bend."},
  lu:{name:"Reverse lunges",kind:"w",mode:"pair",tip:"Step back, back knee close to the floor. Reps per leg."},
  pu:{name:"Push-ups",kind:"b",start:6,tip:"On your knees is fine. Chest close to the floor."},
  bor:{name:"Bent-over row",kind:"w",mode:"single",tip:"Hinge forward, free hand on your knee, pull the dumbbell to your belly. Reps per side."},
  lr:{name:"Lateral raise",kind:"w",mode:"pair",tip:"Go slow. Stop below shoulder height if it feels too hard."},
  te:{name:"Overhead tricep extension",kind:"w",mode:"single",tip:"One dumbbell in both hands, lower it behind your head."},
  ap:{name:"Arnold press",kind:"w",mode:"pair",tip:"Start palms facing you, rotate them out as you press up."},
  ham:{name:"Hammer curl",kind:"w",mode:"pair",tip:"Palms facing each other, elbows pinned. Lower slowly."},
  dip:{name:"Chair dips",kind:"b",start:6,tip:"Hands on a sturdy chair behind you, lower until elbows bend about 90\u00b0."},
  gb:{name:"Glute bridge",kind:"w",mode:"single",start:12,tip:"Lie on your back, dumbbell on your hips, squeeze your glutes up."},
  cr:{name:"Calf raises",kind:"b",start:15,tip:"On a step edge, rise up high, lower slowly."},
  dbug:{name:"Dead bug",kind:"b",start:8,tip:"Lower opposite arm and leg slowly, back flat on the floor. Reps per side."},
  bss:{name:"Bulgarian split squat",kind:"w",mode:"pair",start:8,tip:"Back foot on a chair, lower straight down. Reps per leg."},
  su:{name:"Step-ups",kind:"w",mode:"pair",tip:"Step onto a sturdy chair or step, push through the top foot. Reps per leg."},
  ss:{name:"Sumo squat",kind:"w",mode:"single",start:12,tip:"Wide stance, toes out, hold the dumbbell between your legs."},
  lraise:{name:"Leg raises",kind:"b",start:8,tip:"Lie flat, raise straight legs up, lower slowly without touching the floor."}
};
const WORKOUTS = {UA:["pu","or","sp","bc","te","pl"], LA:["gs","lu","gb","cr","dbug"], UB:["fp","bor","ap","lr","ham","dip"], LB:["rdl","bss","su","ss","lraise"]};
const ORDER = ["UA","LA","UB","LB"];
const WNAMES = {UA:"Upper A",LA:"Lower A",UB:"Upper B",LB:"Lower B"};
const WFOCUS = {UA:"Push-ups, rows, shoulders, arms",LA:"Squats, lunges, glutes, core",UB:"Chest, back, shoulders, arms",LB:"Hinges, single-leg work, core"};
function wname(t){ return WNAMES[t] || ("Workout "+t); }
function nextOf(t){ const i=ORDER.indexOf(t); return ORDER[(i+1)%ORDER.length]; }
const SHORT = {UA:"Up A",LA:"Low A",UB:"Up B",LB:"Low B"};
const FULLDAY = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
/* each lift day has a fixed workout: 1st lift day of the week = Upper A, 2nd = Lower A, 3rd = Upper B, 4th = Lower B */
function liftDays(sel){ return (sel||TRAIN_DAYS).slice().sort((a,b)=>((a+6)%7)-((b+6)%7)); }
function typeForDay(dow,sel){ const i=liftDays(sel).indexOf(dow); return i>=0 ? ORDER[i] : null; }
function dayForType(t){ const d=liftDays()[ORDER.indexOf(t)]; return d==null ? "" : FULLDAY[d]; }
function nextLiftAfter(dow){ for(let k=1;k<=7;k++){ const d=(dow+k)%7; if(TRAIN_DAYS.includes(d)) return d; } return null; }
function todayType(){
  const dow=myNow().getDay();
  const t=typeForDay(dow); if(t) return t;
  /* rest day: make up the most recent missed lift day this week, otherwise preview the next one */
  const done=weekDoneSet();
  if(missedSinceLast()>=1) for(let k=1;k<=6;k++){ const d=(dow-k+7)%7; if(d===0 && dow!==0) break; if(TRAIN_DAYS.includes(d) && !done.has(d)) return typeForDay(d); if(d===1) break; }
  const n=nextLiftAfter(dow); return n==null ? "UA" : typeForDay(n);
}

function poseSVG(p,vb){

  return `<svg viewBox="${vb||"0 -26 120 140"}" aria-hidden="true"><line x1="4" y1="110" x2="116" y2="110" stroke="var(--line)" stroke-width="2"/>${p.x||""}
    ${p.F.map(f=>pl(f,'stroke="var(--muted)" opacity=".45"')).join("")}
    <circle cx="${p.h[0]}" cy="${p.h[1]}" r="9.5" fill="var(--ink)"/>
    ${p.L.map(l=>pl(l,'stroke="var(--ink)"')).join("")}${p.d.map(db).join("")}</svg>`;
}

function posesHTMLFrom(ps){

}

function migrate(s){
  const base = freshState();
  s = Object.assign(base, s||{});
  if(s.v!==2){ s.v=2; s.prog={}; delete s.cur; }
  if(!Array.isArray(s.bells) || !s.bells.length) s.bells = base.bells;
  if(!ORDER.includes(s.nextType)) s.nextType = "UA";
  if(s.draft && !ORDER.includes(s.draft.type)) s.draft = null;
  return s;
}

/* dumbbells */
function availFor(id){
  const e=EX[id];
  const ks = S.bells.filter(b=> e.mode==="pair" ? b.n>=2 : b.n>=1).map(b=>b.kg);
  return [...new Set(ks)].sort((a,b)=>a-b);
}
function P(id){
  if(!S.prog[id]){
    const e=EX[id];
    if(e.kind==="w"){
      const a=availFor(id);
      let kg = e.mode==="pair" ? (a[0]||0) : (a.filter(k=>k<=8).pop() || a[0] || 0);
      S.prog[id]={kg, target:e.start||10, slow:false};
    } else if(e.kind==="t") S.prog[id]={target:20};
    else S.prog[id]={target:e.start||6};
  }
  return S.prog[id];
}
function heavierFor(id){ const p=P(id); return availFor(id).find(k=>k>p.kg); }
function maxedOut(id){ const p=P(id); return EX[id].kind==="w" && p.slow && p.target>=20 && !heavierFor(id); }

async function connect(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [dbNs,userNs] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!dbNs || !userNs) return;
    const id = await userNs.id(); if(!id) return;
    db=dbNs; docRef=db.doc("data/users/"+id+"/peak");
    const snap = await docRef.get();
    if(snap.exists){
      const remote = snap.data();
      if(remote && (remote.updatedAt||0) > (S.updatedAt||0)){
        S = migrate(JSON.parse(JSON.stringify(remote)));
        if(remote.v!==2) save();
        try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
        render(); return;

    }
    if(S.updatedAt) pushRemote();
  }catch(e){}
}

/* ---------- mountain ---------- */
const ROUTE=[[20,250],[90,228],[70,200],[150,182],[125,150],[205,128],[180,98],[245,74],[232,52],[262,30]];
function routePoints(n){
  const seg=[]; let total=0;
  for(let i=1;i<ROUTE.length;i++){ const l=Math.hypot(ROUTE[i][0]-ROUTE[i-1][0],ROUTE[i][1]-ROUTE[i-1][1]); seg.push(l); total+=l; }
  const pts=[];
  for(let k=0;k<=n;k++){
    let d=total*k/n,i=0;
    while(i<seg.length-1 && d>seg[i]){ d-=seg[i]; i++; }
    const t=seg[i]?Math.min(1,d/seg[i]):0;
    pts.push([ROUTE[i][0]+(ROUTE[i+1][0]-ROUTE[i][0])*t, ROUTE[i][1]+(ROUTE[i+1][1]-ROUTE[i][1])*t]);
  }
  return pts;
}
function heroSVG(done){
  const pts=routePoints(TOTAL), k=Math.min(done,TOTAL);
  const full=pts.map(p=>p.join(",")).join(" "), climbed=pts.slice(0,k+1).map(p=>p.join(",")).join(" "), me=pts[k];
  let ticks="";
  pts.forEach((p,i)=>{ if(i>0&&i%4===0) ticks+=`<circle cx="${p[0]}" cy="${p[1]}" r="2.4" fill="${i<=k?"var(--sun)":"#151B3D"}" stroke="${i<=k?"var(--sun)":"rgba(255,255,255,.6)"}" stroke-width="1"/>`; });
  return `<svg viewBox="0 0 400 270" role="img" aria-label="Climb progress: ${k} of ${TOTAL} workouts done">
    <path d="M-10 270 L60 190 L110 215 L180 140 L210 160 L262 26 L300 110 L330 92 L410 200 L410 270 Z" fill="#2A3268"/>
    <path d="M-10 270 L40 238 L95 252 L150 205 L200 232 L262 120 L320 210 L360 180 L410 240 L410 270 Z" fill="#151B3D"/>
    <path d="M262 26 L250 52 L258 48 L262 58 L268 47 L276 54 Z" fill="#FFFFFF" opacity=".92"/>
    <polyline points="${full}" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round" opacity=".5"/>
    <polyline points="${climbed}" fill="none" stroke="var(--sun)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    ${ticks}
    <line x1="262" y1="30" x2="262" y2="6" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M262 6 L282 11 L262 16 Z" fill="${k>=TOTAL?"var(--sun)":"#FFFFFF"}"/>
    <circle cx="${me[0]}" cy="${me[1]}" r="8" fill="#F5C04F" stroke="#FFFFFF" stroke-width="3"/>
  </svg>`;
}

  let body;
  if(doneToday) body=`<h2>Done for today</h2><p class="muted" style="margin-top:6px">Eat well, sleep well. Muscle grows while you rest.</p>`;
  else if(isTrain || missed>=1) body=`<div class="row"><h2>${wname(type)}</h2><span class="badge">${n} sets each</span></div>
      <p class="muted">${WORKOUTS[type].map(id=>EX[id].name).join(", ")}</p>${startBtns}`;
  else body=`<h2>Rest day</h2><p class="muted" style="margin-top:4px">Take a 30-minute walk if you can. Next up is ${wname(type)}${(()=>{ const nd=nextLiftAfter(dow); return nd==null?"":" on "+FULLDAY[nd]; })()}.</p>${startBtns}`;

  const mi=nextMealIdx();
  const meal = mi>=0 ? `<div class="card next"><div class="time">${MEALS[mi].t}</div><div><h3>${esc(MEALS[mi].name)}</h3><p class="muted small" style="margin-top:2px">${esc(MEALS[mi].what)}</p><span class="badge" style="margin-top:6px">≈${MEAL_P[mi]} g protein</span><br>
      <button class="linkbtn" data-act="meal" data-i="${mi}">I ate this</button></div></div>`
    : `<div class="card next"><div class="time">Done</div><div><h3>All meals eaten today</h3><p class="muted small">Good. That’s how you grow.</p></div></div>`;
  const reminders = warn + checkinCard() + upgradeCard();

  return heroBlock(done, done>=TOTAL ? "You reached the peak. Keep going." : `${left} to go. One step at a time.`)
    + `<h2 class="sec">Today’s training</h2><section class="today"><div class="chips">${chips}</div>${body}</section>`
    + `<h2 class="sec">Next meal</h2>${meal}`
    + (reminders ? `<h2 class="sec">For you</h2>${reminders}` : "");
}

function setRow(id,i,st){
  const e=EX[id], done=st.done?" done":"";
  const btn=`<button class="check" data-act="tick" data-ex="${id}" data-i="${i}" aria-label="Mark set ${i+1} done" aria-pressed="${st.done}">${CHECK}</button>`;
  if(e.kind==="w"){
    const opts=availFor(id).map(k=>`<option value="${k}"${+st.w===k?" selected":""}>${k}</option>`).join("");
    return `<div class="set${done}" id="set-${id}-${i}"><div class="n">${i+1}</div>
      <label class="field"><select data-f="w" data-ex="${id}" data-i="${i}" aria-label="${esc(e.name)} set ${i+1} weight">${opts}</select><span>kg</span></label>
      <label class="field"><input type="number" inputmode="numeric" min="0" value="${st.r}" data-f="r" data-ex="${id}" data-i="${i}" aria-label="${esc(e.name)} set ${i+1} reps"><span>reps</span></label>${btn}</div>`;
  }
  const unit=e.kind==="t"?"sec":"reps";
  const play = e.kind==="t" ? `<button class="check play" data-act="hold" data-ex="${id}" data-i="${i}" aria-label="Start timer for set ${i+1}"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg></button>` : "";
  return `<div class="set bw${e.kind==="t"?" tm":""}${done}" id="set-${id}-${i}"><div class="n">${i+1}</div>
    <label class="field"><input type="number" inputmode="numeric" min="0" value="${st.r}" data-f="r" data-ex="${id}" data-i="${i}" aria-label="${esc(e.name)} set ${i+1} ${unit}"><span>${unit}</span></label>${play}${btn}</div>`;
}
function exBlock(id){
  const e=EX[id], p=P(id), d=S.draft;

    <details class="how"><summary>How to do it</summary>${posesHTML(id)}<ol>${HOW[id][0].map(s=>`<li>${s}</li>`).join("")}</ol>
      <div class="mistake"><b>Avoid:</b> ${HOW[id][1]}</div>
      <a class="demo" href="https://www.youtube.com/results?search_query=${encodeURIComponent("dumbbell "+e.name+" proper form beginner")}" target="_blank" rel="noopener">Watch a demo on YouTube</a></details>

function viewSession(){

  let html=`<div class="session-top"><div style="display:flex;justify-content:space-between;align-items:center"><button class="linkbtn" data-act="cancel">Cancel</button><span class="muted small" id="counter">${doneSets} of ${total} sets</span></div>
    <div class="pbar"><i id="pfill" style="width:${total?100*doneSets/total:0}%"></i></div></div>

function chartSVG(){
  const w=S.weights; if(w.length<2) return "";
  const W=340,H=150,Pd=24, ys=w.map(x=>x.kg), min=Math.min(...ys)-1, max=Math.max(...ys)+1;
  const pts=w.map((x,i)=>[Pd+(W-2*Pd)*i/(w.length-1), H-Pd-(H-2*Pd)*(x.kg-min)/(max-min)]);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bodyweight trend"><line x1="${Pd}" y1="${H-Pd}" x2="${W-Pd}" y2="${H-Pd}" stroke="var(--line)"/>
    <polyline points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="var(--accent)"/>`).join("")}
    <text x="${Pd}" y="14" font-size="11" fill="var(--muted)">${max.toFixed(1)} kg</text><text x="${Pd}" y="${H-6}" font-size="11" fill="var(--muted)">${min.toFixed(1)} kg</text></svg>`;
}

  </div>
  <h2 class="sec">Bodyweight</h2>
  <div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">
      <h2>${lastW} kg</h2><span class="muted small">${diff>=0?"+":""}${diff.toFixed(1)} kg since start, BMI ${bmi.toFixed(1)}</span></div>

    <div class="chart">${chartSVG()||`<p class="muted empty small">Log a few weekly weigh-ins to see your trend.</p>`}</div>

  <div style="margin-top:20px"><button class="linkbtn" data-act="reset" style="color:var(--muted)">Start over from zero</button></div>`;
}

/* ---------- workout actions ---------- */
function newSets(id,n){
  const e=EX[id], p=P(id);
  return Array.from({length:n},()=> e.kind==="w" ? {w:p.kg, r:p.target, done:false} : {r:p.target, done:false});
}
function startWorkout(mini){
  const type=todayType(), n=setsNow();
  const list = mini ? [WORKOUTS[type][0]] : WORKOUTS[type].slice();
  const sets={}; list.forEach(id=>sets[id]=newSets(id,n));
  S.draft={type, ts:Date.now(), n, mini:!!mini, list, sets};
  save(); render(); window.scrollTo(0,0);
}
function addExercise(){
  const d=S.draft, nextId=WORKOUTS[d.type].find(id=>!d.list.includes(id));
  if(!nextId) return;
  d.list.push(nextId); d.sets[nextId]=newSets(nextId,d.n);
  save(); render();
}
function levelUp(id, sets){
  const e=EX[id], p=P(id), done=sets.filter(s=>s.done);
  if(!done.length) return null;
  if(e.kind==="w"){
    const used=Math.max(...done.map(s=>+s.w||0));
    if(used!==p.kg){ p.kg=used; }
    const hit = done.length===sets.length && done.every(s=>(+s.r||0)>=p.target && (+s.w||0)>=p.kg);
    if(!hit) return null;
    const heavier=heavierFor(id);
    if(heavier && p.target>=15){ p.kg=heavier; p.target=8; p.slow=false; return `${heavier} kg × 8`; }
    if(p.target<20){ p.target=Math.min(20,p.target+1); return `${p.kg} kg × ${p.target}${p.slow?", slow":""}`; }
    if(!p.slow){ p.slow=true; p.target=12; return `${p.kg} kg × 12, slow`; }
    return null;
  }
  const hit = done.length===sets.length && done.every(s=>(+s.r||0)>=p.target);
  if(!hit) return null;
  if(e.kind==="t"){ if(p.target>=90) return null; p.target=Math.min(90,p.target+5); return `${p.target} sec`; }
  if(p.target>=30) return null; p.target+=1; return `${p.target} reps`;
}
function finishWorkout(){
  const d=S.draft, all=d.list.flatMap(id=>d.sets[id]), doneCount=all.filter(s=>s.done).length;
  if(!doneCount){ toast("Tick at least one set first"); return; }
  const ups=[];
  d.list.forEach(id=>{ const t=levelUp(id,d.sets[id]); if(t) ups.push({name:EX[id].name,text:t}); });
  const exDone=d.list.filter(id=>d.sets[id].some(s=>s.done)).length;
  S.sessions.push({ts:Date.now(), day:dayKey(myNow()), type:d.type, sets:doneCount, mini:d.mini && exDone<3});
  if(exDone>=3) S.nextType = nextOf(d.type);
  S.draft=null; stopTimer(); stopWarm();
  summary={type:d.type, sets:doneCount, ups, mini:d.mini && exDone<3};
  save(); render(); window.scrollTo(0,0);
}

/* ---------- timer ---------- */
let tLeft=0,tTotal=90,tInt=null;
let tPaused=false, tDone=null, tMode="rest";
const TLABEL={rest:"Rest",ready:"Get ready",hold:"Hold it!"};
function startTimer(sec,mode,onDone){ tMode=mode||"rest"; tDone=onDone||null; tPaused=false; tTotal=sec; tLeft=sec;
  $("#timerLabel").textContent=TLABEL[tMode]; $("#timerPause").textContent="Pause"; $("#timerAdd").style.display=tMode==="rest"?"":"none"; $("#timerSkip").textContent=tMode==="rest"?"Skip":"Stop";
  $("#timer").classList.add("on"); tickTimer(); clearInterval(tInt);
  tInt=setInterval(()=>{ if(tPaused) return; tLeft--; tickTimer(); if(tLeft<=0){ const cb=tDone; stopTimer(); if(navigator.vibrate) navigator.vibrate([200,100,200]); if(cb) cb(); else toast("Rest over. Next set!"); } },1000); }
function startHold(id,i){
  const st=S.draft&&S.draft.sets[id]&&S.draft.sets[id][i]; if(!st) return;
  const sec=Math.max(5,+st.r||P(id).target);
  startTimer(3,"ready",()=>startTimer(sec,"hold",()=>{
    toast("Set done!");
    const btn=document.querySelector(`[data-act="tick"][data-ex="${id}"][data-i="${i}"]`);
    if(btn && S.draft && !S.draft.sets[id][i].done) btn.click();
  }));
}
function tickTimer(){ const v=Math.max(0,tLeft); $("#timerNum").textContent=Math.floor(v/60)+":"+String(v%60).padStart(2,"0"); $("#timerBar").style.width=(100*v/tTotal)+"%"; }
function stopTimer(){ clearInterval(tInt); tInt=null; $("#timer").classList.remove("on"); }
$("#timerSkip").addEventListener("click",stopTimer);
$("#timerPause").addEventListener("click",()=>{ tPaused=!tPaused; $("#timerPause").textContent=tPaused?"Resume":"Pause"; $("#timerLabel").textContent=tPaused?"Paused":TLABEL[tMode]; });
$("#timerAdd").addEventListener("click",()=>{ tLeft+=30; tTotal=Math.max(tTotal,tLeft); tickTimer(); });

let sheetCb=null;
function askSheet(msg,sub,yes,no,cb){
  $("#sheetMsg").textContent=msg; $("#sheetSub").textContent=sub||"";
  $("#sheetYes").textContent=yes; $("#sheetNo").textContent=no;
  sheetCb=cb; $("#sheet").classList.add("on"); $("#sheetNo").focus();
}
function closeSheet(){ $("#sheet").classList.remove("on"); sheetCb=null; }
$("#sheetYes").addEventListener("click",()=>{ const cb=sheetCb; closeSheet(); if(cb) cb(); });
$("#sheetNo").addEventListener("click",closeSheet);
$("#sheet").addEventListener("click",e=>{ if(e.target.id==="sheet") closeSheet(); });

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const nb=e.target.closest("nav button");
  if(nb){ tab=nb.dataset.tab; summary=null; render(); window.scrollTo(0,0); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act;
  if(act==="sub"){ sub[b.dataset.g]=b.dataset.k; pickDays=null; render(); return; }
  if(act==="day"){
    const d=+b.dataset.d; let sel=(pickDays||TRAIN_DAYS).slice();
    if(sel.includes(d)) sel=sel.filter(x=>x!==d);
    else { if(sel.length>=4){ toast("4 days max. Tap a lift day to remove it first."); return; } sel.push(d); }
    if(sel.length===4){ S.days=sel.sort((a,b)=>a-b); pickDays=null; save(); render(); toast("Lift days saved"); }
    else { pickDays=sel; render(); }
    return;
  }
  if(act==="mtier"){ marketState().tier=b.dataset.t; save(); render(); return; }
  if(act==="mbuy"){ const m=marketState(); m.bought[b.dataset.k]=!m.bought[b.dataset.k]; save(); render(); return; }
  if(act==="mclear"){ marketState().bought={}; save(); render(); toast("Ticks cleared"); return; }
  if(act==="start") startWorkout(false);
  else if(act==="mini") startWorkout(true);
  else if(act==="addex") addExercise();
  else if(act==="finish") finishWorkout();
  else if(act==="home"){ summary=null; render(); window.scrollTo(0,0); }
  else if(act==="cancel"){ askSheet("Cancel this workout?","Sets you ticked won’t be saved.","Yes, cancel workout","Keep going",()=>{ S.draft=null; stopTimer(); stopWarm(); save(); render(); window.scrollTo(0,0); }); }
  else if(act==="warmstart") startWarm();
  else if(act==="warmnext"){ warm.left=0; advanceWarm(); }
  else if(act==="warmpause"){ warm.paused=!warm.paused; paintWarm(); }
  else if(act==="hold"){ startHold(b.dataset.ex,+b.dataset.i); }
  else if(act==="warmskip"){ stopWarm(); if(S.draft){ S.draft.warmDone=true; save(); } paintWarm(); }
  else if(act==="tick"){
    const id=b.dataset.ex, i=+b.dataset.i, d=S.draft, st=d.sets[id][i];
    st.done=!st.done;
    document.getElementById(`set-${id}-${i}`).classList.toggle("done",st.done);
    b.setAttribute("aria-pressed",st.done);
    const ds=d.list.flatMap(x=>d.sets[x]).filter(s=>s.done).length;
    $("#counter").textContent=`${ds} of ${d.list.length*d.n} sets`;
    $("#pfill").style.width=(100*ds/(d.list.length*d.n))+"%";
    if(st.done){
      const nx=d.sets[id][i+1];
      if(nx && !nx.done && st.w!=null){ nx.w=st.w; const sel=document.querySelector(`select[data-ex="${id}"][data-i="${i+1}"]`); if(sel) sel.value=st.w; }
      startTimer(90);
    }
    save();
  }
  else if(act==="meal"){
    const i=+b.dataset.i, t=mealsToday(); t[i]=!t[i];
    const keys=Object.keys(S.meals).sort(); while(keys.length>14){ delete S.meals[keys.shift()]; }
    save(); render(); if(t[i]) toast(MEALS[i].name+" eaten");
  }
  else if(act==="check"){ S.checks[b.dataset.k]=Date.now(); save(); render(); toast("Saved"); }
  else if(act==="weigh"){
    const v=parseFloat($("#bw").value); if(!(v>=30&&v<=200)){ toast("Enter your weight in kg"); return; }
    const k=dayKey(myNow()), ex=S.weights.find(w=>w.day===k); if(ex) ex.kg=v; else S.weights.push({day:k,kg:v});
    save(); render(); toast("Weight logged");
  }
  else if(act==="addbell"){
    const kg=parseFloat($("#nbKg").value), n=parseInt($("#nbN").value||"1",10);
    if(!(kg>0&&kg<=60)){ toast("Enter the weight in kg"); return; }
    const ex=S.bells.find(x=>x.kg===kg); if(ex) ex.n+=Math.max(1,n); else S.bells.push({kg,n:Math.max(1,n)});
    save(); render(); toast(kg+" kg added");
  }
  else if(act==="delbell"){
    const kg=+b.dataset.kg; if(S.bells.length<=1){ toast("Keep at least one dumbbell"); return; }
    askSheet(`Remove your ${kg} kg dumbbell?`,"Exercises using it will move to a weight you still have.","Remove it","Keep it",()=>{
      S.bells=S.bells.filter(x=>x.kg!==kg);
      Object.keys(S.prog).forEach(id=>{ const p=S.prog[id]; if(EX[id].kind==="w" && !availFor(id).includes(p.kg)){ const a=availFor(id); p.kg=a.filter(k=>k<p.kg).pop()||a[0]||0; } });
      save(); render();
    });
  }
  else if(act==="reset"){ askSheet("Erase everything?","All workouts, weights and progress will be deleted.","Yes, start over","Cancel",()=>{ const bells=S.bells; S=freshState(); S.bells=bells; summary=null; save(); render(); toast("Starting fresh"); }); }
});
function onField(e){
  const el=e.target; if(!el.dataset||!el.dataset.f||!S.draft) return;
  const st=S.draft.sets[el.dataset.ex][+el.dataset.i];
  st[el.dataset.f] = el.value==="" ? "" : +el.value; save();
}
document.addEventListener("input",onField);
document.addEventListener("change",onField);

render();
connect();
})();
</script>
